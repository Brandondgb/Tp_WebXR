<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="musee" src="./museum.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#musee" scale="0.2 0.2 0.2" position="7.46503 0 -4.90405" rotation=""></a-entity>
      
      
      <a-light
        type="point"
        position="0 3 -5"
        intensity="1.2"
        color="#FFD700"
      ></a-light>

      <a-entity id="art1" position="-6 2 -5">
        <a-image
          src="assets/joconde.jpg"
          width="2"
          height="3"
          class="clickable"
        ></a-image>
        <a-text
          id="info1"
          value="Mona Lisa..."
          position="0 -1.8 0"
          align="center"
          width="2.5"
          wrap-count="40"
          visible="false"
          color="black"
        ></a-text>
      </a-entity>

      <a-entity id="art2" position="6 2 -5">
        <a-image
          src="assets/nuit_etoilee.jpg"
          width="2"
          height="3"
          class="clickable"
        ></a-image>
        <a-text
          id="info2"
          value="La Nuit étoilée..."
          position="0 -1.8 0"
          align="center"
          width="2.5"
          wrap-count="40"
          visible="false"
          color="black"
        ></a-text>
      </a-entity>

      <a-entity
        id="penseur"
        gltf-model="assets/penseur.glb"
        position="-1.80308 0.44378 -4"
        scale=""
        debug=""
      >
        <a-text
          id="info3"
          value="Le Penseur..."
          position="0 -0.21586 0"
          align="center"
          width="2.5"
          wrap-count="40"
          visible="false"
          color="black"
          text=""
        >
        </a-text>
      </a-entity>

      <a-entity id="porteEnfer" position="2.43988 2 -3.95698" scale="">
        <a-image
          src="assets/porteenfer.jpg"
          width="2"
          height="3"
          class="clickable"
          material=""
          geometry=""
        ></a-image>
        <a-text
          id="info4"
          value="La Porte de l'Enfer..."
          position="0.29652 -1.8 -0.26819"
          align="center"
          width="2.5"
          wrap-count="40"
          visible="false"
          color="black"
          text=""
        ></a-text>
      </a-entity>

      <a-entity id="imagePieta" position="0 2 -8">
        <a-image
          src="assets/pieta.jpg"
          width="2"
          height="3"
          class="clickable"
        ></a-image>
        <a-text
          id="info5"
          value="La Pietà De Michel Ange"
          position="0 -1.8 0"
          align="center"
          width="2.5"
          wrap-count="40"
          visible="false"
          color="black"
        ></a-text>
      </a-entity>

      <!--Audioguide -->
      <a-entity
        id="audio1"
        sound="src: audio/monalisa.mp3; autoplay: false"
      ></a-entity>
      <a-entity
        id="audio2"
        sound="src: audio/lanuit.mp3; autoplay: false"
      ></a-entity>
      <a-entity
        id="audio3"
        sound="src: audio/penseur.mp3; autoplay: false"
      ></a-entity>
      <a-entity
        id="audio4"
        sound="src: audio/porte.mp3; autoplay: false"
      ></a-entity>
      <a-entity
        id="audio5"
        sound="src: audio/pieta.mp3; autoplay: false"
      ></a-entity>

      <a-entity laser-controls="hand: right"></a-entity>
      <a-entity teleport-controls="collisionEntities: #floor"></a-entity>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <!--Les interactions -->
    <script>
      function toggleZoom(element) {
        let scale = element.getAttribute("scale");
        if (!scale || scale.x === 1) {
          element.setAttribute("scale", { x: 1.5, y: 1.5, z: 1.5 });
        } else {
          element.setAttribute("scale", { x: 1, y: 1, z: 1 });
        }
      }

      function showInfo(infoId) {
        document.querySelector(infoId).setAttribute("visible", true);
      }

      function hideInfo(infoId) {
        document.querySelector(infoId).setAttribute("visible", false);
      }

      function playAudio(audioId) {
        let audio = document.querySelector(audioId);
        if (audio.components.sound.isPlaying) {
          audio.components.sound.stopSound();
        }
        audio.components.sound.playSound();
      }

      function setupInteractions(id, audioId, infoId) {
        let element = document.querySelector(id);
        element.addEventListener("click", function () {
          toggleZoom(this);
          playAudio(audioId);
        });
        element.addEventListener("mouseenter", function () {
          showInfo(infoId);
        });
        element.addEventListener("mouseleave", function () {
          hideInfo(infoId);
        });
      }

      setupInteractions("#art1", "#audio1", "#info1");
      setupInteractions("#art2", "#audio2", "#info2");
      setupInteractions("#penseur", "#audio3", "#info3");
      setupInteractions("#porteEnfer", "#audio4", "#info4");
      setupInteractions("#imagePieta", "#audio5", "#info5");
    </script>

      <a-entity id="rig" position="0 2 0" rotation="0 180 0">
        <a-entity camera look-controls wasd-controls="acceleratiob:60" position="0 0 0"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
